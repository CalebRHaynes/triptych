<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Triptych</title>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="topbar">
  <button class="soloBtn active" data-solo="all">≡</button>
  <button class="soloBtn" data-solo="left">I</button>
  <button class="soloBtn" data-solo="center">II</button>
  <button class="soloBtn" data-solo="right">III</button>
</div>

<div id="triptych">
  <video id="left" muted playsinline></video>
  <video id="center" muted playsinline></video>
  <video id="right" muted playsinline></video>
</div>

<div id="controls">
  <button id="playPause">▶</button>
  <input id="timeline" type="range" min="0" value="0" step="0.01">
</div>

<audio id="audio" preload="auto"></audio>

<script src="script.js"></script>

</body>
</html>
